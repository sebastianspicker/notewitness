name: deploy static demo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - "fixtures/synthetic_lesson/**"
      - "scripts/assemble_pages_demo.py"
      - "scripts/build_pages_demo.sh"
      - "scripts/export_screenshot_state.py"
      - "scripts/pages_demo_client.js"
      - "scripts/render_pages_demo.mjs"
      - "src/notewitness/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - run: bash scripts/build_pages_demo.sh "${RUNNER_TEMP}/notewitness-pages"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/notewitness-pages

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
