name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: bash scripts/verify.sh

  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check .
      - name: Smoke-test installed entrypoints and GUI assets
        run: |
          checkout_dir=$PWD
          probe_dir=$(mktemp -d)
          cd "$probe_dir"
          notewitness --help >/dev/null
          notewitness --version
          notewitness capabilities >/dev/null
          notewitness validate "$checkout_dir/fixtures/synthetic_lesson/project.json"
          provider_status=0
          notewitness-provider-bridge --help 2>provider-error.txt || provider_status=$?
          test "$provider_status" -eq 2
          grep -q "expected exactly" provider-error.txt
          mt3_status=0
          notewitness-mt3-events-bridge --help 2>mt3-error.txt || mt3_status=$?
          test "$mt3_status" -eq 2
          grep -q "expected exactly" mt3-error.txt
          python - <<'PY'
          from pathlib import Path
          from notewitness.presentation import workbench_server
          root = Path(workbench_server.__file__).with_name("workbench_assets")
          for name in ("index.html", "app.css", "app.js", "workbench_ui.mjs", "pitch_estimator.mjs", "notewitness-mark.svg"):
              if not root.joinpath(name).is_file():
                  raise SystemExit(f"missing installed GUI asset: {name}")
          PY
