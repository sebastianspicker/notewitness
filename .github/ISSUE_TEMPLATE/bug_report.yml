name: Bug report
description: Report a reproducible NoteWitness defect using synthetic data.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not attach lesson media, participant data, credentials, model artifacts, or private project files.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0a0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - CLI
        - Workbench
        - Evidence graph or schema
        - Local adapter or provider bridge
        - Documentation or packaging
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Include exact commands, inputs, and observed errors without private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks run
      placeholder: Focused test and bash scripts/verify.sh results
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private media, participant identifiers, credentials, model artifacts, and restricted scores.
          required: true
        - label: This is not a vulnerability report; security issues use SECURITY.md.
          required: true
